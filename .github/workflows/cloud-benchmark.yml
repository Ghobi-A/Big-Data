# Optional, manually triggered Spark benchmark against GCS-backed data.
#
# This workflow runs Spark on the GitHub Actions runner and reads/writes GCS.
# It is NOT a Dataproc multi-worker benchmark and therefore does not record or
# claim worker scaling. True Dataproc runs should be submitted from an actual
# Dataproc environment where worker metadata can be measured directly.
name: GCS-backed Spark benchmark (manual)

on:
  workflow_dispatch:
    inputs:
      input_uri:
        description: "GCS glob of input JPEGs (e.g. gs://bucket/flowers/*/*.jpg)"
        required: true
      output_uri:
        description: "GCS output prefix for benchmark scratch data"
        required: true
      partitions:
        description: "space-separated partition counts"
        default: "1 2 4 8"
      repeats:
        description: "repeats per configuration"
        default: "5"

jobs:
  gcs-spark-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fail early when secrets are missing
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "GCP_SA_KEY secret is not configured." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install package
        run: pip install -e ".[spark,tensorflow,cloud,stats]"

      - name: Run local-Spark benchmark against GCS
        run: |
          python -m distributed_image_pipeline.cli benchmark \
            --input "${{ inputs.input_uri }}" \
            --output "${{ inputs.output_uri }}" \
            --modes spark \
            --partitions ${{ inputs.partitions }} \
            --repeats ${{ inputs.repeats }} \
            --results reports/tables/benchmark_runs.csv \
            --summary reports/tables/benchmark_summary.csv

      - name: Upload measured benchmark metadata
        uses: actions/upload-artifact@v4
        with:
          name: gcs-spark-benchmark-results
          path: |
            reports/tables/
            reports/run_metadata/
